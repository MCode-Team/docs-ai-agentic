services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docs-ai-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SANDBOX_URL=http://sandbox:8000
      - MEMORY_MAINTENANCE_DELAY_MIN=${MEMORY_MAINTENANCE_DELAY_MIN:-10}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      - db
      - sandbox
    # Ensure DB migrations are applied on every (re)start.
    # Safe because migrations use IF NOT EXISTS.
    command: ["sh", "-lc", "export PATH=/root/.bun/bin:$PATH && bun run db:migrate && bun run start"]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # ========================
  # ZERANK (Disabled - Using Cohere Reranking instead)
  # ========================
  # zerank:
  #   build:
  #     context: ./zerank
  #     dockerfile: Dockerfile
  #   container_name: zerank-2
  #   ports:
  #     - "8787:80"
  #   volumes:
  #     - zerank_cache:/data
  #   environment:
  #     - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
  #     - MODEL_ID=zeroentropy/zerank-2
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:80/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 300s

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: python-sandbox
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Resource limits for security
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  maintenance-runner:
    image: curlimages/curl:8.11.1
    container_name: memory-maintenance-runner
    depends_on:
      - web
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - MAINTENANCE_INTERVAL_SECONDS=${MAINTENANCE_INTERVAL_SECONDS:-60}
      - MAINTENANCE_BATCH_LIMIT=${MAINTENANCE_BATCH_LIMIT:-5}
      - MAINTENANCE_DAYS=${MAINTENANCE_DAYS:-3}
    command:
      - sh
      - -lc
      - |
        set -e
        if [ -z "$$CRON_SECRET" ]; then
          echo "CRON_SECRET is required for maintenance-runner" >&2
          exit 1
        fi
        echo "Starting maintenance runner. Interval=$${MAINTENANCE_INTERVAL_SECONDS}s"
        while true; do
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $${CRON_SECRET}" \
            http://web:3000/api/internal/run-memory-maintenance \
            -d "{\"limit\":$${MAINTENANCE_BATCH_LIMIT},\"days\":$${MAINTENANCE_DAYS}}" \
            || true
          sleep $${MAINTENANCE_INTERVAL_SECONDS}
        done
    restart: unless-stopped

volumes:
  postgres_data:
  # zerank_cache:  # Disabled - Using Cohere Reranking

